# Best options from the cell_type ablation (seed 0): all three help. Run with --config configs/cell_type.yaml
seed: 0
label_col: cell_type
min_class_size: 20       # smaller types are unlabeled
split: random            # random | left_right | right_left (train on one hemisphere, test on the other)
feature_norm: global     # global (z-score on train) | per_side | rank_per_side (per hemisphere)
drop_edge: 0.0           # augmentation: per-neuron edge drop rate drawn from [0, drop_edge] each epoch
bidirectional: true      # also aggregate over postsynaptic partners (false = plain GraphSAGE)
edge_weight: count       # neighbor mean weighted by: none | count (synapses) | log (log1p synapses)
class_weight: balanced   # loss weights against class imbalance: none | balanced | sqrt
hidden_dim: 64
num_layers: 2
dropout: 0.3
lr: 0.01
weight_decay: 0.0005
epochs: 300              # val macro-F1 rises < 0.002 over the last 50 epochs
run_name: null           # default: gnn_<timestamp>
