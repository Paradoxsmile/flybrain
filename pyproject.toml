[project]
name = "flybrain"
version = "0.1.0"
description = "ML on the Drosophila connectome: GNN cell-type prediction (FlyWire/MCNS) and connectome-constrained models."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Maximilian Vogt" }]
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "torch",
    "torch-geometric",
    "pyyaml",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flybrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
